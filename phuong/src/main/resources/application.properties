spring.application.name=Library-Management-System
server.port=${SERVER_PORT:5000}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_management}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:library_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.frontend.reset-url=${FRONTEND_URL:http://localhost:5173}/reset-password?token=
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.callback.base-url=${FRONTEND_URL:http://localhost:5173}
stripe.api.key=${STRIPE_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
library.notification.from=${MAIL_FROM:noreply@library.local}
library.notification.enabled=${NOTIFICATION_ENABLED:false}
library.notification.due-reminder-days=${DUE_REMINDER_DAYS:3}

subscription.default.plan=${DEFAULT_SUBSCRIPTION_PLAN:MONTHLY}
subscription.auto.renew.enabled=${SUBSCRIPTION_AUTO_RENEW:false}
subscription.expiry.check.cron=${SUBSCRIPTION_EXPIRY_CRON:0 0 2 * * ?}
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:5}

app.seed.admin.email=${ADMIN_EMAIL:admin@library.local}
app.seed.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed.admin.name=${ADMIN_NAME:Library Admin}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL:http://localhost:5000}/login/oauth2/code/google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

spring.devtools.livereload.enabled=${DEVTOOLS_LIVERELOAD:false}
logging.level.org.hibernate.SQL=${HIBERNATE_LOG_LEVEL:INFO}
